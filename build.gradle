// NOTE: loom version, yarn mappings and loader version below must match the official template
// https://github.com/MeteorDevelopment/meteor-addon-template (branch/tag for 1.21.11).
// If a value fails to resolve, copy the exact value from the template's build.gradle / gradle.properties.
plugins {
    id 'fabric-loom' version '1.14-SNAPSHOT'
}

base {
    archivesName = project.archives_base_name
}

group = project.maven_group
version = project.mod_version

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.meteordevelopment.com/releases' }
    maven { url = 'https://maven.meteordevelopment.com/snapshots' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "meteordevelopment:meteor-client:${project.meteor_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
